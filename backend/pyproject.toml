[project]
name = "aadhya-backend"
version = "0.1.0"
description = "Aadhya Pickles & Dairy — commerce API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # AAD-SEC-003: the [crypto] extra pulls in `cryptography`, which RS256
    # verification (Google's ID tokens) needs — previously pulled in
    # transitively by google-auth, now declared explicitly since that
    # package is gone.
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "razorpay>=1.4",
    # Already pulled in transitively by razorpay, but AAD-PAY-008's
    # _TimeoutSession subclasses requests.Session directly — imported by our
    # own code now, not just by the SDK, so it's declared explicitly rather
    # than relied on as someone else's dependency.
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests>=2.32",
    # AAD-OPS-005: there's no lockfile for a scanner to check without this —
    # `pip-audit -r requirements-lock.txt` is the local equivalent of the
    # Dependabot alerts this repo doesn't have yet (no CI pipeline exists at
    # all — see AAD-OPS-012 — so wiring this into a scheduled CI job is
    # future work, not something to fake here).
    "pip-audit>=2.7",
    # AAD-OPS-024: coverage measurement. Nothing reported it before this,
    # so the gaps AAD-OPS-021 found in the auth/authorization layer were
    # invisible — see scripts/check_coverage.py for how this is gated.
    "pytest-cov>=6.0",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.setuptools.packages.find]
# Only "app" is the installable package. "alembic" is migration tooling that
# lives alongside it, not a package to install — without this, setuptools
# sees two top-level directories and refuses to guess which one you meant.
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
