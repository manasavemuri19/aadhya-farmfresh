[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# AAD-QUAL-025: this was unset, silently relying on alembic's own internal
# default (which happens to be this same `%(rev)s_%(slug)s` pattern) rather
# than stating the convention explicitly here. Every existing revision
# (0001-0017) has its numeric-prefix `rev` chosen by hand via
# `alembic revision --rev-id 0018_whatever -m "..."` rather than accepting
# the random hash id `alembic revision` generates on its own — that manual
# step is what keeps the sequence readable, and still has to be done
# deliberately for the next one; this setting only makes the resulting
# filename pattern an explicit, documented choice instead of an implicit
# fallback nobody reading this file would know to expect. %%(rev)s is
# alembic's own escaping for a literal %(rev)s in this .ini file's
# interpolation syntax.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
